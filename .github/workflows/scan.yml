name: nightly-scan
on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scan.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}